name: Sync Upstream to Main

# 手动触发：将上游 fish2018/webhtv 的最新提交合并进本仓库 main 并推送。
# 仅做“合并 + 推送”，发布由 android-release.yml 负责。
on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "上游分支/ref 名（默认 main）"
        required: false
        default: "main"
        type: string

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  sync:
    name: Merge upstream into main and push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.email "action@webhtv.local"
          git config user.name "sync-bot"

      - name: Merge upstream (fish2018/webhtv)
        run: |
          git remote add upstream https://github.com/fish2018/webhtv.git || true
          git remote set-url upstream https://github.com/fish2018/webhtv.git
          git fetch upstream --tags
          echo "Upstream tip: $(git rev-parse --short upstream/${{ inputs.upstream_ref }})"
          git merge --no-edit upstream/${{ inputs.upstream_ref }} || {
            echo "::error::Upstream merge conflicted. Resolve conflicts locally before building."
            git merge --abort
            exit 1
          }
          echo "HEAD after sync: $(git rev-parse --short HEAD)"

      - name: Push merged main
        run: |
          git push origin main
